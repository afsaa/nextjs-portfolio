query GetNavigation($locale: String) {
  navigationCollection(order: sys_publishedAt_ASC, locale: $locale) {
    items {
      sys {
        id
      }
      title
      pathname
    }
  }
}

query GetUser($userId: String!, $locale: String) {
  user(id: $userId, locale: $locale) {
    name
    role
    summary
    profilePicture {
      title
      url
    }
    cv {
      url
    }
  }
}

query GetExpPreview($previewId: String!, $locale: String) {
  preview(id: $previewId, locale: $locale) {
    experienceHeading
    experienceDescription
  }
}

query GetAllExps($locale: String) {
  experienceCollection(order: sys_firstPublishedAt_ASC, locale: $locale) {
    items {
      sys {
        id
        publishedAt
      }
      contentfulMetadata {
        tags {
          id
          name
        }
      }
      jobTitle
      companyName
      description {
        json
      }
      timeWorked
      companyLogo {
        url
      }
    }
  }
}

query GetPersonalInfo($personId: String!, $locale: String) {
  personalInfo(id: $personId, locale: $locale) {
    sys {
      id
    }
    title
    name
    headshot {
      url
    }
    bio
    location
    email
    linkedin
    github
  }
}

query GetProjects($locale: String) {
  projectCollection(locale: $locale) {
    items {
      title
      description
      technologies
      image {
        url
      }
      url
    }
  }
}

query GetAllSkills($locale: String) {
  skillCollection(locale: $locale) {
    items {
      technology
      isHardSkill
      isOtherSkill
      isSoftSkill
    }
  }
}

query GetContactSection($contactSectionId: String!, $locale: String) {
  contactSection(id: $contactSectionId, locale: $locale) {
    heading
    description {
      json
    }
  }
}

query GetContact($contactId: String!, $locale: String) {
  contact(id: $contactId, locale: $locale) {
    mainParagraph
    contactSectionsCollection(locale: $locale) {
      items {
        ... on ContactSection {
          heading
          description {
            json
          }
        }
      }
    }
  }
}

query GetHomePageData($locale: String, $userId: String!, $previewId: String!, $personId: String!) {
  navigationCollection(order: sys_publishedAt_ASC, locale: $locale) {
    items {
      sys {
        id
      }
      title
      pathname
    }
  }
  user(id: $userId, locale: $locale) {
    name
    role
    summary
    profilePicture {
      title
      url
    }
    cv {
      url
    }
  }
  preview(id: $previewId, locale: $locale) {
    experienceHeading
    experienceDescription
  }
  experienceCollection(order: sys_publishedAt_DESC, locale: $locale) {
    items {
      sys {
        id
        publishedAt
      }
      contentfulMetadata {
        tags {
          id
          name
        }
      }
      jobTitle
      companyName
      description {
        json
      }
      timeWorked
      companyLogo {
        url
      }
    }
  }
  personalInfo(id: $personId, locale: $locale) {
    sys {
      id
    }
    title
    name
    headshot {
      url
    }
    bio
    location
    email
    linkedin
    github
  }
}

query GetAboutPageData($locale: String, $personId: String!) {
  navigationCollection(order: sys_publishedAt_ASC, locale: $locale) {
    items {
      sys {
        id
      }
      title
      pathname
    }
  }
  personalInfo(id: $personId, locale: $locale) {
    sys {
      id
    }
    title
    name
    headshot {
      url
    }
    bio
    location
    email
    linkedin
    github
  }
  skillCollection(locale: $locale) {
    items {
      technology
      isHardSkill
      isOtherSkill
      isSoftSkill
    }
  }
}
